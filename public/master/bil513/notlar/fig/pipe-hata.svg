<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Takılan okuyucu: child yazdı, fd[1]'i kapattı ve çıktı. Parent bütün veriyi okudu ama kendi fd[1]'ini hâlâ açık tutuyor. Write end'e bir referans kaldığı için EOF gelmez ve parent read'de sonsuza kadar bekler." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="ph-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-cur"/></marker>
    <marker id="ph-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-warn"/></marker>
  </defs>
  <rect class="box-plain dash" x="30" y="30" width="180" height="60" rx="6"/>
  <text x="120" y="55" text-anchor="middle" font-weight="600">child (yazar)</text>
  <text x="120" y="74" text-anchor="middle" font-size="12" class="t-mut">yazdı, kapattı, çıktı</text>
  <rect class="box" x="300" y="96" width="160" height="50" rx="6"/>
  <text x="380" y="118" text-anchor="middle" font-weight="600">pipe tamponu</text>
  <text x="380" y="136" text-anchor="middle" font-size="12" class="t-mut">boş</text>
  <text x="312" y="166" text-anchor="end" font-size="11.5" class="t-mut">yazma ucu</text>
  <text x="448" y="166" text-anchor="end" font-size="11.5" class="t-mut">okuma ucu</text>
  <line class="ln dash" x1="210" y1="66" x2="296" y2="108"/>
  <line class="ln" x1="245" y1="74" x2="261" y2="96"/>
  <line class="ln" x1="261" y1="74" x2="245" y2="96"/>
  <text x="270" y="60" font-size="12">fd[1] kapalı</text>
  <rect class="box" x="560" y="150" width="170" height="60" rx="6"/>
  <text x="645" y="175" text-anchor="middle" font-weight="600">parent (okuyucu)</text>
  <text x="645" y="194" text-anchor="middle" font-size="12">read() → bekliyor</text>
  <line class="ln" x1="462" y1="124" x2="600" y2="147" marker-end="url(#ph-a)"/>
  <text x="545" y="124" font-size="12">fd[0]: veri okundu</text>
  <polyline class="ln-warn" points="560,196 320,196 320,150" marker-end="url(#ph-w)"/>
  <text x="440" y="188" text-anchor="middle" font-size="12" class="t-warn" font-weight="600">unutulan fd[1]</text>
  <text x="440" y="222" text-anchor="middle" font-size="12" class="t-warn">yazar referansı = 1 → EOF gelmez</text>
</svg>
