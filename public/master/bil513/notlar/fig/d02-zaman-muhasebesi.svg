<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Slayt 17'deki P işinin zaman muhasebesi. P 2'de gelir, 2–5 arası hazır bekler, 5–7 çalışır, 7–10 arası yine hazır bekler, 10–12 çalışır ve 12'de biter. R = S − A = 3 yalnız ilk beklemeyi sayar; W = 3 + 3 = 6 bütün hazır beklemeyi; B = 2 + 2 = 4 çalışmayı; T = C − A = 10 varıştan bitişe her şeyi." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="d02zm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-cur"/></marker>
  </defs>
  <text x="380" y="20" text-anchor="middle" font-weight="600">P: A = 2, S = 5, C = 12, B = 4</text>

  <g font-size="12">
    <text x="156" y="48" text-anchor="middle">A = 2 · varış</text>
    <text x="300" y="48" text-anchor="middle" class="t-acc" font-weight="600">S = 5 · ilk başlama</text>
    <text x="636" y="48" text-anchor="middle">C = 12 · bitiş</text>
  </g>
  <line class="faint" x1="156" y1="54" x2="156" y2="130"/>
  <line class="faint" x1="300" y1="54" x2="300" y2="130"/>
  <line class="faint" x1="636" y1="54" x2="636" y2="130"/>

  <text x="30" y="94" font-weight="600">P</text>
  <rect class="box-plain dash" x="156" y="74" width="144" height="30" rx="4"/>
  <text x="228" y="94" text-anchor="middle" class="t-mut">hazır</text>
  <rect class="box-acc" x="300" y="74" width="96" height="30" rx="4"/>
  <text x="348" y="94" text-anchor="middle" class="t-acc" font-weight="600">çalışır</text>
  <rect class="box-plain dash" x="396" y="74" width="144" height="30" rx="4"/>
  <text x="468" y="94" text-anchor="middle" class="t-mut">hazır (kesildi)</text>
  <rect class="box-acc" x="540" y="74" width="96" height="30" rx="4"/>
  <text x="588" y="94" text-anchor="middle" class="t-acc" font-weight="600">çalışır</text>

  <line class="ln" x1="60" y1="130" x2="700" y2="130" marker-end="url(#d02zm-a)"/>
  <g class="ln">
    <line x1="60" y1="130" x2="60" y2="136"/><line x1="108" y1="130" x2="108" y2="136"/><line x1="156" y1="130" x2="156" y2="136"/>
    <line x1="204" y1="130" x2="204" y2="136"/><line x1="252" y1="130" x2="252" y2="136"/><line x1="300" y1="130" x2="300" y2="136"/>
    <line x1="348" y1="130" x2="348" y2="136"/><line x1="396" y1="130" x2="396" y2="136"/><line x1="444" y1="130" x2="444" y2="136"/>
    <line x1="492" y1="130" x2="492" y2="136"/><line x1="540" y1="130" x2="540" y2="136"/><line x1="588" y1="130" x2="588" y2="136"/>
    <line x1="636" y1="130" x2="636" y2="136"/><line x1="684" y1="130" x2="684" y2="136"/>
  </g>
  <g font-size="11" class="t-mut" text-anchor="middle">
    <text x="60" y="150">0</text><text x="108" y="150">1</text><text x="156" y="150">2</text><text x="204" y="150">3</text>
    <text x="252" y="150">4</text><text x="300" y="150">5</text><text x="348" y="150">6</text><text x="396" y="150">7</text>
    <text x="444" y="150">8</text><text x="492" y="150">9</text><text x="540" y="150">10</text><text x="588" y="150">11</text>
    <text x="636" y="150">12</text><text x="684" y="150">13</text>
  </g>
  <text x="712" y="134" class="t-mut" font-size="12">t</text>

  <path class="ln-acc" d="M156,172 V180 H300 V172"/>
  <text x="312" y="184" class="t-acc" font-weight="600">R = S − A = 3</text>
  <text x="420" y="184" class="t-mut" font-size="12">yalnız ilk bekleme</text>

  <path class="ln" d="M156,204 V212 H300 V204"/>
  <path class="ln" d="M396,204 V212 H540 V204"/>
  <text x="552" y="216" font-weight="600">W = 3 + 3 = 6</text>
  <text x="552" y="231" class="t-mut" font-size="12">bütün hazır bekleme</text>

  <path class="ln-acc" d="M300,240 V248 H396 V240"/>
  <path class="ln-acc" d="M540,240 V248 H636 V240"/>
  <text x="408" y="252" class="t-acc" font-size="12">B = 2 + 2 = 4 (CPU'da)</text>

  <path class="ln" d="M156,266 V274 H636 V266"/>
  <text x="396" y="292" text-anchor="middle" font-weight="600">T = C − A = 10 = W + B</text>
</svg>
