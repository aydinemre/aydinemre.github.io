<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="Tek CPU'da A ve B'nin beş adımlık izi. 3. adımda A'nın girdisi gelmiştir, A ready'dir ama CPU hâlâ B'dedir. 5. adımda iki görev de ilerleyemez; başka iş yoksa CPU boşta kalır." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <g font-size="11.5" class="t-mut" text-anchor="middle">
    <text x="164" y="22">1 · A hesaplar</text>
    <text x="292" y="22">2 · A girdi ister</text>
    <text x="420" y="22">3 · A'nın girdisi gelir</text>
    <text x="548" y="22">4 · B yanıt bekler</text>
    <text x="676" y="22">5 · A biter</text>
  </g>
  <text x="20" y="69" font-weight="600">A</text>
  <text x="20" y="115" font-weight="600">B</text>
  <text x="20" y="161" font-weight="600">CPU</text>
  <rect class="box" x="104" y="50" width="120" height="30" rx="4"/><text x="164" y="70" text-anchor="middle">Running</text>
  <rect class="box-plain dash" x="232" y="50" width="120" height="30" rx="4"/><text x="292" y="70" text-anchor="middle">Waiting</text>
  <rect class="box-acc" x="360" y="50" width="120" height="30" rx="4"/><text x="420" y="70" text-anchor="middle" class="t-acc" font-weight="600">Ready</text>
  <rect class="box" x="488" y="50" width="120" height="30" rx="4"/><text x="548" y="70" text-anchor="middle">Running</text>
  <text x="676" y="70" text-anchor="middle" class="t-mut">Terminated</text>
  <rect class="box-plain" x="104" y="96" width="120" height="30" rx="4"/><text x="164" y="116" text-anchor="middle">Ready</text>
  <rect class="box" x="232" y="96" width="120" height="30" rx="4"/><text x="292" y="116" text-anchor="middle">Running</text>
  <rect class="box" x="360" y="96" width="120" height="30" rx="4"/><text x="420" y="116" text-anchor="middle">Running</text>
  <rect class="box-plain dash" x="488" y="96" width="120" height="30" rx="4"/><text x="548" y="116" text-anchor="middle">Waiting</text>
  <rect class="box-plain dash" x="616" y="96" width="120" height="30" rx="4"/><text x="676" y="116" text-anchor="middle">Waiting</text>
  <text x="164" y="162" text-anchor="middle">A</text>
  <text x="292" y="162" text-anchor="middle">B</text>
  <text x="420" y="162" text-anchor="middle" font-weight="600">B (A değil)</text>
  <text x="548" y="162" text-anchor="middle">A</text>
  <text x="676" y="162" text-anchor="middle" class="t-mut">boşta (başka iş yoksa)</text>
  <line class="faint" x1="100" y1="140" x2="740" y2="140"/>
  <g font-size="11.5" class="t-mut">
    <rect class="box" x="104" y="182" width="16" height="12" rx="2"/><text x="126" y="192">CPU'da</text>
    <rect class="box-plain" x="190" y="182" width="16" height="12" rx="2"/><text x="212" y="192">çalışabilir</text>
    <rect class="box-plain dash" x="296" y="182" width="16" height="12" rx="2"/><text x="318" y="192">olay bekliyor</text>
  </g>
</svg>
