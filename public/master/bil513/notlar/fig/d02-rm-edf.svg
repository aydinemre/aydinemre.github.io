<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Example B, 0–100 ms, RM ve EDF alt alta. RM: P1 0–25, P2 25–50, 50'de yeni P1 işi P2'yi keser ve 50–75 çalışır, P2 75–85 çalışır; 80'deki deadline geçilir, P2#1 85'te 5 geç biter, P2#2 85–100. EDF: P1 0–25, P2 25–60 (50'de P2#1'in deadline'ı 80, P1#2'ninki 100 olduğu için P2 sürer), P1 60–85, P2#2 85–100; kaçırma yok." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <text x="400" y="18" text-anchor="middle" font-weight="600">Example B: P1 = (C 25, T 50), P2 = (C 35, T 80), D = T</text>

  <line class="faint" x1="400" y1="40" x2="400" y2="100"/>
  <line class="faint" x1="400" y1="154" x2="400" y2="214"/>
  <line class="ln-warn dash" x1="586" y1="40" x2="586" y2="100"/>
  <line class="ln-warn dash" x1="586" y1="154" x2="586" y2="214"/>
  <text x="586" y="35" text-anchor="middle" class="t-warn" font-size="12" font-weight="600">P2#1 deadline d = 80</text>
  <text x="400" y="35" text-anchor="middle" class="t-mut" font-size="12">50: P1#2 salınır (d = 100)</text>

  <text x="14" y="76" font-weight="600">RM</text>
  <text x="82" y="61" text-anchor="end" font-size="12">P1</text>
  <text x="82" y="89" text-anchor="end" font-size="12">P2</text>
  <rect class="box" x="90" y="46" width="155" height="22" rx="3"/><text x="167" y="61" text-anchor="middle" font-size="11">P1#1</text>
  <rect class="box" x="400" y="46" width="155" height="22" rx="3"/><text x="477" y="61" text-anchor="middle" font-size="11">P1#2</text>
  <rect class="box-acc" x="245" y="74" width="155" height="22" rx="3"/><text x="322" y="89" text-anchor="middle" font-size="11" class="t-acc">P2#1</text>
  <rect class="box-acc" x="555" y="74" width="62" height="22" rx="3"/><text x="570" y="89" text-anchor="middle" font-size="9.5" class="t-acc">P2#1</text>
  <rect class="ln-warn" x="586" y="72" width="31" height="26"/>
  <rect class="box-plain" x="617" y="74" width="93" height="22" rx="3"/><text x="663" y="89" text-anchor="middle" font-size="11">P2#2</text>
  <line class="ln" x1="90" y1="100" x2="710" y2="100"/>
  <g font-size="10" class="t-mut" text-anchor="middle">
    <text x="90" y="113">0</text><text x="152" y="113">10</text><text x="214" y="113">20</text><text x="276" y="113">30</text>
    <text x="338" y="113">40</text><text x="400" y="113">50</text><text x="462" y="113">60</text><text x="524" y="113">70</text>
    <text x="586" y="113">80</text><text x="648" y="113">90</text><text x="710" y="113">100</text>
  </g>
  <text x="400" y="134" text-anchor="middle" font-size="12">RM: T1 = 50 &lt; T2 = 80 → P1#2 keser</text>
  <text x="617" y="134" text-anchor="middle" font-size="12" class="t-warn" font-weight="600">85: P2#1 biter, 5 geç</text>

  <text x="14" y="190" font-weight="600">EDF</text>
  <text x="82" y="175" text-anchor="end" font-size="12">P1</text>
  <text x="82" y="203" text-anchor="end" font-size="12">P2</text>
  <rect class="box" x="90" y="160" width="155" height="22" rx="3"/><text x="167" y="175" text-anchor="middle" font-size="11">P1#1</text>
  <rect class="box" x="462" y="160" width="155" height="22" rx="3"/><text x="539" y="175" text-anchor="middle" font-size="11">P1#2</text>
  <rect class="box-acc" x="245" y="188" width="217" height="22" rx="3"/><text x="353" y="203" text-anchor="middle" font-size="11" class="t-acc">P2#1</text>
  <rect class="box-plain" x="617" y="188" width="93" height="22" rx="3"/><text x="663" y="203" text-anchor="middle" font-size="11">P2#2</text>
  <line class="ln" x1="90" y1="214" x2="710" y2="214"/>
  <g font-size="10" class="t-mut" text-anchor="middle">
    <text x="90" y="227">0</text><text x="152" y="227">10</text><text x="214" y="227">20</text><text x="276" y="227">30</text>
    <text x="338" y="227">40</text><text x="400" y="227">50</text><text x="462" y="227">60</text><text x="524" y="227">70</text>
    <text x="586" y="227">80</text><text x="648" y="227">90</text><text x="710" y="227">100</text>
  </g>
  <text x="290" y="248" text-anchor="middle" font-size="12">EDF: 50'de 80 &lt; 100 → P2#1 sürer</text>
  <text x="480" y="248" text-anchor="middle" font-size="12" class="t-acc" font-weight="600">60: P2#1 biter ✔</text>

  <line class="faint" x1="20" y1="262" x2="740" y2="262"/>
  <g font-size="11">
    <rect class="box" x="90" y="274" width="18" height="12" rx="2"/><text x="114" y="284">P1 işi</text>
    <rect class="box-acc" x="180" y="274" width="18" height="12" rx="2"/><text x="204" y="284">P2#1</text>
    <rect class="box-plain" x="260" y="274" width="18" height="12" rx="2"/><text x="284" y="284">P2#2 (80'de salınır, d = 160)</text>
    <rect class="ln-warn" x="470" y="274" width="18" height="12"/><text x="494" y="284">deadline'dan sonra çalışılan kısım</text>
  </g>
  <text x="740" y="113" text-anchor="end" class="t-mut" font-size="10">ms</text>
</svg>
