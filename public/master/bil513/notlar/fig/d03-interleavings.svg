<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-label="Sayaç 0'dan başlar; A ve B birer artırma yapar, her artırma R (oku) ve W (yaz) adımıdır. Altı soyut sıra: AABB ve BBAA 2 ile biter, ABAB, ABBA, BAAB ve BABA 1 ile biter çünkü iki thread de birisi yazmadan 0 okur. Altı soyut sıra altı eşit olasılıklı yürütme değildir." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
