  <text x="145" y="190" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">F</text>
  <text x="241" y="190" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">F</text>
