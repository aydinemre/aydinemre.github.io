  <text x="529" y="190" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12" class="t-acc">T</text>
  <text x="625" y="190" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">T</text>
  <text x="20" y="212" font-family="ui-monospace, Menlo, monospace" font-size="12">flag[1]</text>
  <text x="92" y="212" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">F</text>
  <text x="145" y="212" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">F</text>
  <text x="241" y="212" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">F</text>
  <text x="337" y="212" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12" class="t-acc">T</text>
  <text x="433" y="212" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">T</text>
  <text x="529" y="212" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">T</text>
  <text x="625" y="212" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">T</text>
  <text x="20" y="234" font-family="ui-monospace, Menlo, monospace" font-size="12">turn</text>
  <text x="92" y="234" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">0</text>
  <text x="145" y="234" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12" class="t-acc">1</text>
  <text x="241" y="234" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12" class="t-acc">0</text>
  <text x="337" y="234" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">0</text>
  <text x="433" y="234" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">0</text>
  <text x="529" y="234" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">0</text>
  <text x="625" y="234" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">0</text>
  <text x="714" y="212" text-anchor="middle" font-weight="600" font-size="12" class="t-warn">iki CS</text>
  <text x="714" y="228" text-anchor="middle" font-weight="600" font-size="12" class="t-warn">aynı anda</text>

  <text x="20" y="268" font-size="12">P1, flag[0]'ı F gördüğü için girdi; P0, turn'ün son yazanı olmadığı için (turn = 0) beklemedi.</text>
  <text x="20" y="288" font-size="12" class="t-mut">Aynı iz kaynak kodda sırası ters Peterson'da SC altında da oluşur. volatile bunu onarmaz [sl. 19].</text>
</svg>
