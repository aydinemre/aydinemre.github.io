<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" role="img" aria-label="Öncelik terslenmesi. Üstte kalıtım yok: L kilidi alır, H gelir ve kilidi isteyip bloklanır, M gelir ve L'yi önler; L kilidi bırakamaz, H dolaylı olarak M'yi bekler. Altta öncelik kalıtımı var: H bloklanınca L'nin etkin önceliği H'ye çıkar, M L'yi kesemez, L kilidi bırakır, H kilidi alıp çalışır, sonra M çalışır." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <text x="380" y="18" text-anchor="middle" font-weight="600" font-size="12.5">Öncelik terslenmesi (priority inversion): H, L'nin kilidini bekler; M, L'yi önler [sl. 63]</text>
  <text x="740" y="46" text-anchor="end" font-size="11.5" class="t-mut">zaman →</text>
  <text x="20" y="46" font-weight="600" font-size="12.5">Kalıtım yok</text>
  <text x="20" y="78" font-size="12">H (yüksek)</text>
  <text x="20" y="112" font-size="12">M (orta)</text>
  <text x="20" y="146" font-size="12">L (düşük)</text>
  <line class="bar" x1="120" y1="142" x2="240" y2="142"/>
  <circle cx="150" cy="142" r="4.5" class="f-cur"/>
  <text x="150" y="133" text-anchor="middle" font-size="11">kilidi alır</text>
  <line class="bar" x1="240" y1="74" x2="276" y2="74"/>
  <circle cx="276" cy="74" r="4.5" class="f-cur"/>
  <text x="284" y="65" font-size="11">lock → bloklanır</text>
  <line class="bar-k" x1="285" y1="74" x2="720" y2="74"/>
  <text x="720" y="65" text-anchor="end" font-weight="600" font-size="11.5" class="t-warn">H dolaylı olarak M'yi bekler: sınırsız gecikme</text>
  <line class="bar" x1="276" y1="142" x2="330" y2="142"/>
  <line class="bar" x1="330" y1="108" x2="720" y2="108"/>
  <text x="334" y="99" font-size="11">M hazır olur; M &gt; L → M çalışır</text>
  <line class="faint" x1="339" y1="142" x2="720" y2="142"/>
  <line class="faint" x1="246" y1="142" x2="270" y2="142"/>
  <text x="334" y="133" font-size="11" class="t-mut">hazır ama çalışamıyor; kilit hâlâ L'de</text>

  <text x="20" y="188" font-weight="600" font-size="12.5" class="t-acc">Öncelik kalıtımı var (POSIX'te açıkça seçilir: PTHREAD_PRIO_INHERIT, ek bilgi)</text>
  <text x="20" y="220" font-size="12">H (yüksek)</text>
  <text x="20" y="254" font-size="12">M (orta)</text>
  <text x="20" y="288" font-size="12">L (düşük)</text>
  <line class="bar" x1="120" y1="284" x2="240" y2="284"/>
  <circle cx="150" cy="284" r="4.5" class="f-cur"/>
  <text x="150" y="275" text-anchor="middle" font-size="11">kilidi alır</text>
  <line class="bar" x1="240" y1="216" x2="276" y2="216"/>
  <circle cx="276" cy="216" r="4.5" class="f-cur"/>
  <text x="284" y="207" font-size="11">bloklanır</text>
  <line class="bar-k" x1="285" y1="216" x2="420" y2="216"/>
  <line class="bar" x1="420" y1="216" x2="540" y2="216"/>
  <text x="424" y="207" font-weight="600" font-size="11">kilidi alır, çalışır</text>
  <line class="bar-acc" x1="276" y1="284" x2="420" y2="284"/>
  <text x="280" y="275" font-weight="600" font-size="11" class="t-acc">etkin öncelik = H</text>
  <circle cx="420" cy="284" r="4.5" class="f-acc"/>
  <text x="428" y="275" font-size="11">unlock → önceliği L'ye döner</text>
  <line class="faint" x1="429" y1="284" x2="720" y2="284"/>
  <line class="faint" x1="246" y1="284" x2="270" y2="284"/>
  <line class="faint" x1="330" y1="250" x2="540" y2="250"/>
  <text x="334" y="241" font-size="11" class="t-mut">hazır; L(=H) &gt; M, bekler</text>
  <line class="bar" x1="540" y1="250" x2="720" y2="250"/>
  <text x="544" y="241" font-size="11">H bitince çalışır</text>

  <line class="bar" x1="24" y1="318" x2="54" y2="318"/>
  <text x="62" y="322" font-size="11.5">çalışıyor</text>
  <line class="bar-acc" x1="140" y1="318" x2="170" y2="318"/>
  <text x="178" y="322" font-size="11.5">yükseltilmiş öncelikle</text>
  <line class="bar-k" x1="320" y1="318" x2="350" y2="318"/>
  <text x="358" y="322" font-size="11.5">bloklu (kilidi bekler)</text>
  <line class="faint" x1="500" y1="318" x2="530" y2="318"/>
  <text x="538" y="322" font-size="11.5">hazır, çalışmıyor</text>
  <text x="20" y="344" font-size="12" class="t-mut">Kalıtım belirli bir protokoldür: varsayılan mutex özelliği sayılmaz ve keyfi döngüsel beklemeyi çözmez [sl. 63].</text>
</svg>
