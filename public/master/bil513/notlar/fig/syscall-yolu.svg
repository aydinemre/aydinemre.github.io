<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-label="printf'ten write system call'ına yol: printf metni process belleğindeki stdio tamponuna yazar; write wrapper'ı yalnızca bir system call numarası seçip trap yapar; kernel tablodan handler'ı bulur, doğrular, işler ve sonucu döndürür." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="sy-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-cur"/></marker>
    <marker id="sy-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-acc"/></marker>
  </defs>
  <line class="faint" x1="20" y1="132" x2="800" y2="132"/>
  <text x="800" y="22" text-anchor="end" class="t-mut" font-size="12" font-style="italic">user space</text>
  <text x="800" y="262" text-anchor="end" class="t-mut" font-size="12" font-style="italic">kernel</text>
  <rect class="box" x="30" y="40" width="160" height="52" rx="6"/>
  <text x="110" y="64" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12.5">printf("a\n")</text>
  <text x="110" y="82" text-anchor="middle" class="t-mut" font-size="12">biçimlendirir</text>
  <rect class="box" x="240" y="40" width="160" height="52" rx="6"/>
  <text x="320" y="64" text-anchor="middle" font-weight="600">stdio tamponu</text>
  <text x="320" y="82" text-anchor="middle" class="t-mut" font-size="12">process belleğinde</text>
  <rect class="box" x="450" y="40" width="170" height="52" rx="6"/>
  <text x="535" y="64" text-anchor="middle" font-weight="600">write() wrapper</text>
  <text x="535" y="82" text-anchor="middle" class="t-mut" font-size="12">numara n + argümanlar</text>
  <line class="ln" x1="192" y1="66" x2="236" y2="66" marker-end="url(#sy-a)"/>
  <text x="214" y="112" text-anchor="middle" font-size="12">ekle</text>
  <line class="ln" x1="402" y1="66" x2="446" y2="66" marker-end="url(#sy-a)"/>
  <text x="424" y="112" text-anchor="middle" font-size="12">gerekince</text>
  <line class="ln-acc" x1="535" y1="92" x2="535" y2="174" marker-end="url(#sy-b)"/>
  <text x="545" y="150" font-size="12" class="t-acc" font-weight="600">trap: kullanıcı yalnız n'yi seçer</text>
  <rect class="box" x="450" y="178" width="170" height="52" rx="6"/>
  <text x="535" y="201" text-anchor="middle" font-weight="600">giriş kodu</text>
  <text x="535" y="219" text-anchor="middle" class="t-mut" font-size="12">register'lar kaydedilir</text>
  <rect class="box" x="240" y="178" width="160" height="52" rx="6"/>
  <text x="320" y="201" text-anchor="middle" font-weight="600">tablo[n]</text>
  <text x="320" y="219" text-anchor="middle" class="t-mut" font-size="12">→ sys_write</text>
  <rect class="box" x="30" y="178" width="160" height="52" rx="6"/>
  <text x="110" y="201" text-anchor="middle" font-weight="600">doğrula + işle</text>
  <text x="110" y="219" text-anchor="middle" class="t-mut" font-size="12">adres geçerli mi?</text>
  <line class="ln" x1="448" y1="204" x2="404" y2="204" marker-end="url(#sy-a)"/>
  <line class="ln" x1="238" y1="204" x2="194" y2="204" marker-end="url(#sy-a)"/>
  <line class="ln" x1="80" y1="178" x2="80" y2="96" marker-end="url(#sy-a)"/>
  <text x="88" y="150" font-size="12">dönüş (hata: −1, errno)</text>
</svg>
