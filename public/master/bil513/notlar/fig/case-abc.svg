<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Üç durumda da kernel'e girilir. Case A'da kernel aynı göreve P'ye döner. Case B'de P bloklanır ve Q seçilir. Case C'de timer interrupt sonrasında P de Q da çalışabilir; interrupt tek başına görev değişiminin kanıtı değildir." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <text x="200" y="16" class="t-mut" font-size="11.5">üst çizgi: user mode · alt çizgi: kernel mode</text>
  <text x="705" y="16" text-anchor="middle" class="t-mut" font-size="11.5">görev değişti mi?</text>
  <!-- Case A -->
  <text x="20" y="52" font-weight="600">Case A</text>
  <text x="20" y="69" class="t-mut" font-size="12">servis, sonuç hazır</text>
  <line class="bar" x1="200" y1="45" x2="335" y2="45"/>
  <text x="267" y="36" text-anchor="middle" font-size="12">P</text>
  <line class="ln" x1="340" y1="45" x2="340" y2="75"/>
  <line class="bar-k" x1="345" y1="75" x2="475" y2="75"/>
  <text x="410" y="95" text-anchor="middle" font-size="12" class="t-mut">kernel: veri hazır</text>
  <line class="ln" x1="480" y1="75" x2="480" y2="45"/>
  <line class="bar" x1="485" y1="45" x2="640" y2="45"/>
  <text x="562" y="36" text-anchor="middle" font-size="12">P devam eder</text>
  <text x="705" y="64" text-anchor="middle" font-weight="600">hayır</text>
  <!-- Case B -->
  <text x="20" y="137" font-weight="600">Case B</text>
  <text x="20" y="154" class="t-mut" font-size="12">bloklayan istek</text>
  <line class="bar" x1="200" y1="130" x2="335" y2="130"/>
  <text x="267" y="121" text-anchor="middle" font-size="12">P</text>
  <line class="ln" x1="340" y1="130" x2="340" y2="160"/>
  <line class="bar-k" x1="345" y1="160" x2="475" y2="160"/>
  <text x="410" y="180" text-anchor="middle" font-size="12" class="t-mut">P bloklandı → Q seç</text>
  <line class="ln" x1="480" y1="160" x2="480" y2="130"/>
  <line class="bar-acc" x1="485" y1="130" x2="640" y2="130"/>
  <text x="562" y="121" text-anchor="middle" font-size="12" class="t-acc" font-weight="600">Q</text>
  <text x="705" y="149" text-anchor="middle" font-weight="600" class="t-acc">evet</text>
  <!-- Case C -->
  <text x="20" y="222" font-weight="600">Case C</text>
  <text x="20" y="239" class="t-mut" font-size="12">timer interrupt</text>
  <line class="bar" x1="200" y1="215" x2="335" y2="215"/>
  <text x="267" y="206" text-anchor="middle" font-size="12">P</text>
  <line class="ln" x1="340" y1="215" x2="340" y2="245"/>
  <line class="bar-k" x1="345" y1="245" x2="475" y2="245"/>
  <text x="410" y="265" text-anchor="middle" font-size="12" class="t-mut">scheduler karar verir</text>
  <line class="ln" x1="480" y1="245" x2="480" y2="215"/>
  <line class="bar dash" x1="485" y1="215" x2="640" y2="215"/>
  <text x="562" y="206" text-anchor="middle" font-size="12">P ya da Q</text>
  <text x="705" y="234" text-anchor="middle" font-weight="600">belki</text>
</svg>
