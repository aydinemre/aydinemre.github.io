<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-label="Transfer: A = 100, B = 50; A'dan B'ye 10 aktarılır. Kilitsiz sürümde yazar önce A'yı 90 yapar, sonra B'yi 60. Okuyucu ara durumda A = 90 ve B = 50 okursa toplamı 140 görür; A'yı başta, B'yi sonda okursa 160. Kilitli sürümde transfer ve okuma aynı mutex altındadır, okuyucu yalnız 150 görür." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="d03ts-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-cur"/></marker>
    <marker id="d03ts-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-warn"/></marker>
  </defs>
  <text x="380" y="20" text-anchor="middle" font-weight="600" font-size="12.5">A'dan B'ye 10 birim. Değişmez: A + B = 150 [sl. 28]</text>
  <text x="20" y="48" font-weight="600" font-size="12.5">Kilitsiz: iki bağımsız atomik store; okuyucu kilit almadan A ve B'yi okur</text>
  <rect class="box" x="40" y="62" width="150" height="56" rx="8"/>
  <text x="115" y="86" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12.5">A = 100 · B = 50</text>
  <text x="115" y="106" text-anchor="middle" font-size="12" class="t-mut">toplam 150</text>
  <rect class="f-warn" x="305" y="62" width="150" height="56" rx="8" fill-opacity="0.12"/>
  <rect class="ln-warn dash" x="305" y="62" width="150" height="56" rx="8"/>
  <text x="380" y="86" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12.5">A = 90 · B = 50</text>
  <text x="380" y="106" text-anchor="middle" font-weight="600" font-size="12" class="t-warn">ara durum: toplam 140</text>
  <rect class="box" x="570" y="62" width="150" height="56" rx="8"/>
  <text x="645" y="86" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12.5">A = 90 · B = 60</text>
  <text x="645" y="106" text-anchor="middle" font-size="12" class="t-mut">toplam 150</text>
  <line class="ln" x1="190" y1="90" x2="301" y2="90" marker-end="url(#d03ts-a)"/>
  <text x="245" y="82" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5">yazar: A ← 90</text>
  <line class="ln" x1="455" y1="90" x2="566" y2="90" marker-end="url(#d03ts-a)"/>
  <text x="510" y="82" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5">yazar: B ← 60</text>
  <text x="295" y="183" text-anchor="end" font-weight="600" font-size="12">okuyucu</text>
  <rect class="box-plain" x="305" y="154" width="150" height="48" rx="6"/>
  <text x="380" y="174" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">load A → 90</text>
  <text x="380" y="192" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12">load B → 50</text>
  <line class="ln-warn" x1="380" y1="152" x2="380" y2="122" marker-end="url(#d03ts-w)"/>
  <text x="470" y="183" font-weight="600" font-size="12.5" class="t-warn">görülen toplam 140 (10 “kayboldu”)</text>
  <text x="20" y="226" font-size="12" class="t-mut">Ters sıra da olur: A başta (100), B sonda (60) okunursa toplam 160. İki atomik store yarım transferi gizlemez [sl. 28].</text>
  <line class="faint" x1="20" y1="244" x2="740" y2="244"/>
  <text x="20" y="270" font-weight="600" font-size="12.5">Kilitli: transfer de okuma da aynı mutex altında; debit ve credit tek işlem [sl. 28]</text>
  <rect class="box" x="40" y="284" width="150" height="56" rx="8"/>
  <text x="115" y="308" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12.5">A = 100 · B = 50</text>
  <text x="115" y="328" text-anchor="middle" font-size="12" class="t-mut">toplam 150</text>
  <rect class="box-acc" x="240" y="280" width="280" height="64" rx="8"/>
  <text x="380" y="302" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12" class="t-acc">lock · A ← 90 · B ← 60 · unlock</text>
  <text x="380" y="322" text-anchor="middle" font-size="11.5">ara durum (90, 50) kilidin içinde kalır,</text>
  <text x="380" y="337" text-anchor="middle" font-size="11.5">kilit tutulmadan görülemez</text>
  <rect class="box" x="570" y="284" width="150" height="56" rx="8"/>
  <text x="645" y="308" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12.5">A = 90 · B = 60</text>
  <text x="645" y="328" text-anchor="middle" font-size="12" class="t-mut">toplam 150</text>
  <line class="ln" x1="190" y1="312" x2="236" y2="312" marker-end="url(#d03ts-a)"/>
  <line class="ln" x1="520" y1="312" x2="566" y2="312" marker-end="url(#d03ts-a)"/>
  <text x="380" y="374" text-anchor="middle" font-weight="600" font-size="12.5" class="t-acc">Okuyucu da lock · A + B · unlock yapar: yalnız 1. ya da 3. durumu görür → toplam her zaman 150.</text>
</svg>
