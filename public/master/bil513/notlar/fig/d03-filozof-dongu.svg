  <text x="570" y="241" text-anchor="middle" font-weight="600" font-size="12" class="t-acc">yok</text>
  <text x="500" y="145.536" text-anchor="end" font-size="11" class="t-mut">F4: c0'ı bekler,</text>
  <text x="500" y="159.536" text-anchor="end" font-size="11" class="t-mut">hiçbir şey tutmadan</text>
  <text x="504.641" y="363.464" text-anchor="middle" font-weight="600" font-size="11.5" class="t-acc">F3: c3 + c4 → yer</text>

  <line class="ln" x1="40" y1="386" x2="76" y2="386"/>
  <text x="84" y="390" font-size="11.5">tutuyor</text>
  <line class="ln-warn" x1="160" y1="386" x2="196" y2="386" marker-end="url(#d03fd-w)"/>
  <text x="204" y="390" font-size="11.5">bekliyor (döngüde)</text>
  <line class="ln" x1="340" y1="386" x2="376" y2="386" marker-end="url(#d03fd-a)"/>
  <text x="384" y="390" font-size="11.5">bekliyor (zincir ilerler)</text>
  <text x="20" y="414" font-size="12">Dışlama çalışıyor; hiçbir çubuğun iki sahibi yok. Sorun, edinimlerin döngüsel bağımlılığı [sl. 59].</text>
  <text x="20" y="434" font-size="12" class="t-mut">Sıralama döngüyü imkânsız kılar (tutulan numaralar zincirde kesin artar); bounded waiting ve adaleti kanıtlamaz [sl. 60].</text>
