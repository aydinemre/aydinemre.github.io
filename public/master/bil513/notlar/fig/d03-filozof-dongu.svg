<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" role="img" aria-label="Beş filozof. Solda herkes önce sol çubuğu alır: F0 c0'ı, F1 c1'i ... F4 c4'ü tutar ve her biri sağdaki, komşusunun tuttuğu çubuğu bekler; döngü F0, F1, F2, F3, F4, F0 kapanır. Sağda her filozof küçük numaralı çubuğu önce alır: F4 önce c0'ı ister ve hiçbir şey tutmadan bekler, c4 boş kalır, F3 c4'ü alıp yer; döngü kırılır." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="d03fd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-cur"/></marker>
    <marker id="d03fd-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-warn"/></marker>
  </defs>
  <text x="190" y="36" text-anchor="middle" font-weight="600" font-size="12.5">Herkes önce sol çubuğu alır [sl. 59]</text>
  <text x="190" y="56" text-anchor="middle" font-size="11.5" class="t-warn">beşi de tutuluyor; F0 → F1 → F2 → F3 → F4 → F0</text>
  <text x="570" y="36" text-anchor="middle" font-weight="600" font-size="12.5">Küçük numaralı çubuk önce [sl. 60]</text>
  <text x="570" y="56" text-anchor="middle" font-size="11.5" class="t-acc">F4'ün sırası değişir: önce c0, sonra c4</text>
