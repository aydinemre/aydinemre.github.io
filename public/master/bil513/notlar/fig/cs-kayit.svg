<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Context switch: CPU'daki PC ve register'lar P'nin PCB'sine kaydedilir, Q'nun PCB'sinden geri yüklenir. Adres alanları bellekte yerinde kalır; PCB onları yalnızca gösterir, bellek kopyalanmaz." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="cs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-cur"/></marker>
    <marker id="cs-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-acc"/></marker>
  </defs>
  <rect class="box" x="280" y="30" width="200" height="66" rx="6"/>
  <text x="380" y="56" text-anchor="middle" font-weight="600">CPU</text>
  <text x="380" y="76" text-anchor="middle" font-size="12">PC · SP · register'lar</text>
  <rect class="box" x="30" y="140" width="190" height="72" rx="6"/>
  <text x="125" y="164" text-anchor="middle" font-weight="600">PCB(P)</text>
  <text x="125" y="182" text-anchor="middle" font-size="12">saklı PC, register'lar</text>
  <text x="125" y="199" text-anchor="middle" font-size="12" class="t-mut">mm → P'nin alanı</text>
  <rect class="box" x="540" y="140" width="190" height="72" rx="6"/>
  <text x="635" y="164" text-anchor="middle" font-weight="600">PCB(Q)</text>
  <text x="635" y="182" text-anchor="middle" font-size="12">saklı PC, register'lar</text>
  <text x="635" y="199" text-anchor="middle" font-size="12" class="t-mut">mm → Q'nun alanı</text>
  <line class="ln" x1="296" y1="96" x2="170" y2="137" marker-end="url(#cs-a)"/>
  <text x="222" y="104" text-anchor="end" font-size="12" font-weight="600">① P'yi kaydet</text>
  <line class="ln-acc" x1="590" y1="137" x2="466" y2="99" marker-end="url(#cs-b)"/>
  <text x="540" y="104" font-size="12" class="t-acc" font-weight="600">② Q'yu yükle</text>
  <rect class="box-plain" x="20" y="246" width="720" height="62" rx="8"/>
  <text x="380" y="240" text-anchor="middle" font-size="12" class="t-mut">Ana bellek</text>
  <rect class="box" x="60" y="258" width="230" height="38" rx="4"/>
  <text x="175" y="282" text-anchor="middle" font-size="12">P'nin adres alanı</text>
  <rect class="box" x="470" y="258" width="230" height="38" rx="4"/>
  <text x="585" y="282" text-anchor="middle" font-size="12">Q'nun adres alanı</text>
  <line class="ln dash" x1="125" y1="212" x2="160" y2="255" marker-end="url(#cs-a)"/>
  <line class="ln dash" x1="635" y1="212" x2="600" y2="255" marker-end="url(#cs-a)"/>
  <text x="380" y="270" text-anchor="middle" font-size="12" font-weight="600">yerinde kalır,</text>
  <text x="380" y="287" text-anchor="middle" font-size="12" font-weight="600">kopyalanmaz</text>
</svg>
