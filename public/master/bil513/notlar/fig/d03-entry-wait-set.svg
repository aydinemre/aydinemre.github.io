<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Java monitörü: kilidi almak isteyen thread kilit doluysa entry set'te bekler, sonra kilidi alıp sahip olur. Sahip wait() çağırınca kilidi bırakır ve wait set'e geçer. notify() wait set'ten keyfi bir thread'i entry set'e taşır, doğrudan sahip yapmaz; o thread kilit için yarışır ve koşulu yeniden kontrol etmelidir." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="d03ew-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-cur"/></marker>
    <marker id="d03ew-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-acc"/></marker>
  </defs>
  <text x="380" y="18" text-anchor="middle" font-weight="600" font-size="12.5">Java monitörü: iki ayrı bekleme nedeni [sl. 48; OSC ch7 sl. 31–33]</text>
  <rect class="box" x="30" y="84" width="180" height="92" rx="12"/>
  <text x="120" y="104" text-anchor="middle" font-weight="600">entry set</text>
  <text x="120" y="122" text-anchor="middle" font-size="11.5" class="t-mut">kilidi almak için bekler</text>
  <circle class="box-plain" cx="84" cy="152" r="11"/>
  <text x="84" y="156" text-anchor="middle" font-size="11">T</text>
  <circle class="box-plain" cx="120" cy="152" r="11"/>
  <text x="120" y="156" text-anchor="middle" font-size="11">T</text>
  <circle class="box-plain" cx="156" cy="152" r="11"/>
  <text x="156" y="156" text-anchor="middle" font-size="11">T</text>
  <rect class="box-acc" x="290" y="84" width="180" height="92" rx="12"/>
  <text x="380" y="104" text-anchor="middle" font-weight="600" class="t-acc">sahip</text>
  <text x="380" y="122" text-anchor="middle" font-size="11.5" class="t-mut">kilidi tutan tek thread</text>
  <circle class="box-acc" cx="380" cy="152" r="11"/>
  <text x="380" y="156" text-anchor="middle" font-size="11">T</text>
  <rect class="box" x="550" y="84" width="180" height="92" rx="12"/>
  <text x="640" y="104" text-anchor="middle" font-weight="600">wait set</text>
  <text x="640" y="122" text-anchor="middle" font-size="11.5" class="t-mut">kilidi bıraktı, koşulu bekler</text>
  <circle class="box-plain dash" cx="622" cy="152" r="11"/>
  <text x="622" y="156" text-anchor="middle" font-size="11">T</text>
  <circle class="box-plain dash" cx="658" cy="152" r="11"/>
  <text x="658" y="156" text-anchor="middle" font-size="11">T</text>

  <line class="ln" x1="120" y1="46" x2="120" y2="80" marker-end="url(#d03ew-a)"/>
  <text x="128" y="58" font-size="11.5">synchronized: kilit doluysa</text>
  <line class="ln" x1="380" y1="82" x2="380" y2="48" marker-end="url(#d03ew-a)"/>
  <text x="388" y="58" font-size="11.5">çıkış: kilidi bırakır</text>
  <line class="ln" x1="210" y1="130" x2="286" y2="130" marker-end="url(#d03ew-a)"/>
  <text x="248" y="120" text-anchor="middle" font-size="11.5">kilidi alır</text>
  <line class="ln" x1="470" y1="130" x2="546" y2="130" marker-end="url(#d03ew-a)"/>
  <text x="508" y="106" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12">wait()</text>
  <text x="508" y="120" text-anchor="middle" font-size="11">kilidi bırakır</text>
  <path class="ln-acc" d="M640,178 V218 H120 V180" marker-end="url(#d03ew-b)"/>
  <text x="380" y="238" text-anchor="middle" font-weight="600" font-size="12.5" class="t-acc">notify(): wait set'ten keyfi bir T → entry set'e (doğrudan sahibe değil)</text>
  <text x="380" y="260" text-anchor="middle" font-size="12">Bildirim yalnız kilit için yarışma hakkı verir; yüklem artık doğru olmayabilir → while ile yeniden kontrol [sl. 48].</text>
  <text x="380" y="282" text-anchor="middle" font-size="12" class="t-mut">Şekil FIFO kabul vaat etmez [sl. 76].</text>
</svg>
